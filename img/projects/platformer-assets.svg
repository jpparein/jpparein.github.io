<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
  </defs>
  <rect width="480" height="300" fill="url(#bg)"/>
  <!-- Sprite sheet grid -->
  <g opacity="0.9">
    <!-- Row 1 -->
    <rect x="40" y="40" width="48" height="48" fill="#22c55e" opacity="0.8"/>
    <rect x="100" y="40" width="48" height="48" fill="#fb923c" opacity="0.8"/>
    <rect x="160" y="40" width="48" height="48" fill="#ef4444" opacity="0.8"/>
    <rect x="220" y="40" width="48" height="48" fill="#8b5cf6" opacity="0.8"/>
    <rect x="280" y="40" width="48" height="48" fill="#06b6d4" opacity="0.8"/>
    <!-- Row 2 -->
    <rect x="40" y="100" width="48" height="48" fill="#f59e0b" opacity="0.8"/>
    <rect x="100" y="100" width="48" height="48" fill="#ec4899" opacity="0.8"/>
    <rect x="160" y="100" width="48" height="48" fill="#14b8a6" opacity="0.8"/>
    <rect x="220" y="100" width="48" height="48" fill="#f97316" opacity="0.8"/>
    <rect x="280" y="100" width="48" height="48" fill="#6366f1" opacity="0.8"/>
    <!-- Row 3 -->
    <rect x="40" y="160" width="48" height="48" fill="#10b981" opacity="0.8"/>
    <rect x="100" y="160" width="48" height="48" fill="#a855f7" opacity="0.8"/>
    <rect x="160" y="160" width="48" height="48" fill="#e11d48" opacity="0.8"/>
    <rect x="220" y="160" width="48" height="48" fill="#0ea5e9" opacity="0.8"/>
    <rect x="280" y="160" width="48" height="48" fill="#84cc16" opacity="0.8"/>
  </g>
  <!-- Platform elements -->
  <rect x="370" y="50" width="50" height="12" fill="#22c55e"/>
  <rect x="370" y="70" width="40" height="12" fill="#22c55e"/>
  <rect x="380" y="120" width="40" height="12" fill="#78350f"/>
  <rect x="385" y="140" width="35" height="12" fill="#78350f"/>
  <!-- Character sprite -->
  <rect x="382" y="96" width="14" height="20" rx="3" fill="#fb923c"/>
  <rect x="384" y="92" width="10" height="8" rx="2" fill="#fbbf24"/>
  <!-- Label -->
  <text x="240" y="255" text-anchor="middle" fill="#a78bfa" font-family="monospace" font-size="14" font-weight="700">SPRITES &amp; ASSETS</text>
  <text x="240" y="275" text-anchor="middle" fill="#7c3aed" font-family="monospace" font-size="10">2D Game Kit</text>
</svg>
