<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none">
  <!-- Window frame -->
  <rect width="960" height="640" rx="8" fill="#F0F2F5"/>
  <rect x="1" y="1" width="958" height="638" rx="7" fill="#F0F2F5" stroke="#D0D0D0" stroke-width="1"/>

  <!-- Title bar -->
  <rect x="1" y="1" width="958" height="30" rx="7" fill="#FFFFFF"/>
  <rect x="1" y="16" width="958" height="15" fill="#FFFFFF"/>
  <circle cx="20" cy="16" r="5" fill="#F44336"/>
  <circle cx="36" cy="16" r="5" fill="#FF9800"/>
  <circle cx="52" cy="16" r="5" fill="#4CAF50"/>
  <text x="480" y="21" font-family="Segoe UI,sans-serif" font-size="11" fill="#9E9E9E" text-anchor="middle">GitDesk</text>

  <!-- Top bar -->
  <rect x="1" y="30" width="958" height="44" fill="#1a237e"/>
  <rect x="12" y="37" width="34" height="28" rx="4" fill="#FFFFFF"/>
  <text x="22" y="56" font-family="Segoe UI,sans-serif" font-size="14" fill="#1a237e">📂</text>
  <text x="56" y="56" font-family="Segoe UI,sans-serif" font-size="13" fill="#FFFFFF">C:\Users\Jean\Documents\mon-projet</text>
  <rect x="428" y="38" width="70" height="24" rx="4" fill="#2E7D32"/>
  <text x="438" y="54" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Git OK</text>
  <rect x="504" y="38" width="70" height="24" rx="4" fill="#FF8F00"/>
  <text x="514" y="54" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">🌿 main</text>
  <rect x="580" y="38" width="60" height="24" rx="4" fill="#2E7D32"/>
  <text x="590" y="54" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">✔ à jour</text>
  <rect x="870" y="37" width="34" height="28" rx="4" fill="#283593"/>
  <text x="878" y="56" font-family="Segoe UI,sans-serif" font-size="14" fill="#FFFFFF">⟳</text>
  <rect x="910" y="37" width="40" height="28" rx="4" fill="#283593"/>
  <text x="916" y="55" font-family="Segoe UI,sans-serif" font-size="11" font-weight="600" fill="#FFFFFF">Auto</text>

  <!-- SIDEBAR -->
  <rect x="1" y="74" width="200" height="565" fill="#263238"/>

  <text x="17" y="100" font-family="Segoe UI,sans-serif" font-size="10" font-weight="700" fill="#607D8B">SECTION</text>

  <!-- Items - plain text, no icons, FontSize 14 -->
  <text x="17" y="130" font-family="Segoe UI,sans-serif" font-size="14" fill="#FFFFFF">Démarrer</text>
  <text x="17" y="166" font-family="Segoe UI,sans-serif" font-size="14" fill="#FFFFFF">Sauvegardes</text>
  <text x="17" y="202" font-family="Segoe UI,sans-serif" font-size="14" fill="#FFFFFF">Fichiers</text>
  <text x="17" y="238" font-family="Segoe UI,sans-serif" font-size="14" fill="#64FFDA">Avancé</text>
  <text x="17" y="274" font-family="Segoe UI,sans-serif" font-size="14" fill="#FFFFFF">Configuration Git</text>

  <text x="17" y="314" font-family="Segoe UI,sans-serif" font-size="12" fill="#90CAF9">Référence</text>
  <text x="17" y="340" font-family="Segoe UI,sans-serif" font-size="12" fill="#90CAF9">Aide</text>
  <text x="17" y="366" font-family="Segoe UI,sans-serif" font-size="12" fill="#EF9A9A">Don</text>

  <!-- Bottom bar -->
  <line x1="1" y1="502" x2="201" y2="502" stroke="#37474F" stroke-width="1"/>
  <rect x="1" y="502" width="200" height="38" fill="#263238"/>
  <text x="17" y="525" font-family="Segoe UI,sans-serif" font-size="11" fill="#90CAF9">🌙</text>
  <g transform="translate(52,514)">
    <rect x="0" y="0" width="28" height="18" rx="2" fill="#FFFFFF" stroke="#90A4AE" stroke-width="1"/>
    <rect x="0" y="0" width="9.33" height="18" fill="#002395"/>
    <rect x="18.67" y="0" width="9.33" height="18" fill="#ED2939"/>
    <rect x="34" y="0" width="28" height="18" rx="2" fill="#012169" stroke="#90A4AE" stroke-width="1"/>
    <path d="M34 9h28M48 0v18" stroke="#FFFFFF" stroke-width="3"/>
    <path d="M34 3.5h28M34 14.5h28M41 0v18" stroke="#C8102E" stroke-width="1.5"/>
    <path d="M48 0v18" stroke="#C8102E" stroke-width="1.5"/>
  </g>

  <!-- Content area -->
  <rect x="201" y="74" width="758" height="565" fill="#F0F2F5"/>

  <!-- Section Header -->
  <text x="225" y="114" font-family="Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#1a237e">Démarrer</text>
  <text x="225" y="136" font-family="Segoe UI,sans-serif" font-size="13" fill="#757575">Bienvenue sur GitDesk ! Commencez par ouvrir un dossier.</text>

  <!-- Welcome Card -->
  <rect x="225" y="156" width="714" height="110" rx="10" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <text x="241" y="186" font-family="Segoe UI,sans-serif" font-size="20" font-weight="700" fill="#1a237e">Bienvenue sur GitDesk</text>
  <text x="241" y="210" font-family="Segoe UI,sans-serif" font-size="14" fill="#555555" line-height="22">L'outil Git simple et accessible. Ouvrez un dossier existant ou créez un nouveau dépôt</text>
  <text x="241" y="232" font-family="Segoe UI,sans-serif" font-size="14" fill="#555555">pour commencer à suivre vos fichiers avec Git.</text>
  <!-- Browse button -->
  <rect x="241" y="246" width="130" height="34" rx="4" fill="#1976D2"/>
  <text x="265" y="268" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">📂 Ouvrir un dossier</text>

  <!-- Getting Started Card -->
  <rect x="225" y="280" width="714" height="182" rx="10" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <text x="241" y="310" font-family="Segoe UI,sans-serif" font-size="15" font-weight="700" fill="#1a237e">Pour commencer</text>
  <text x="241" y="332" font-family="Segoe UI,sans-serif" font-size="13" fill="#757575">Suivez ces étapes simples pour utiliser GitDesk avec vos projets.</text>

  <!-- Step 1 -->
  <circle cx="257" cy="366" r="14" fill="#1976D2"/>
  <text x="257" y="371" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="285" y="370" font-family="Segoe UI,sans-serif" font-size="13" fill="#555555">Cliquez sur "Ouvrir un dossier" et sélectionnez votre projet</text>

  <!-- Step 2 -->
  <circle cx="257" cy="402" r="14" fill="#1976D2"/>
  <text x="257" y="407" font-family="Segoe UI,sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="285" y="406" font-family="Segoe UI,sans-serif" font-size="13" fill="#555555">Cliquez sur "Initialiser un dépôt" pour activer Git dans ce dossier</text>

  <rect x="241" y="428" width="280" height="34" rx="4" fill="#1976D2"/>
  <text x="300" y="450" font-family="Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Initialiser un dépôt Git</text>

  <!-- Tip of the day Card -->
  <rect x="225" y="476" width="714" height="68" rx="10" fill="#FFFFFF" stroke="#E8E8E8" stroke-width="1"/>
  <text x="241" y="502" font-family="Segoe UI,sans-serif" font-size="14" font-weight="700" fill="#FF8F00">💡 Astuce du jour</text>
  <text x="241" y="524" font-family="Segoe UI,sans-serif" font-size="13" fill="#333333">Vous pouvez créer une sauvegarde (commit) en un clic depuis la section Sauvegardes. Le staging est automatique !</text>
</svg>
