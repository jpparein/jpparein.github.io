<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><link rel="stylesheet" href="C:/Users/parei/Desktop/Portfolio/styles.css"></head>
<body>
<pre id="o">...</pre>
<script>
window.addEventListener('load', function(){
  var out = [];
  var pts = [[190,125],[190,83],[150,100],[230,155],[190,104]];
  pts.forEach(function(p){
    var el = document.elementFromPoint(p[0], p[1]);
    var info = 'null';
    if (el) {
      info = el.tagName + '[' + (el.getAttribute('class') || '') + ']';
      if (el.ownerSVGElement) {
        // find parent g with class
        var g = el.closest('g');
        if (g) info += ' in g.' + (g.getAttribute('class')||'');
      }
    }
    out.push(p.join(',') + ' => ' + info);
  });
  var n = document.querySelector('.ws-network');
  if (n) out.push('network: ' + JSON.stringify(n.getBoundingClientRect()));
  var svg = document.querySelector('.workshop-svg');
  if (svg) out.push('svg: ' + JSON.stringify(svg.getBoundingClientRect()));
  document.getElementById('o').textContent = out.join('\n');
  document.title = 'MEASURE_DONE';
});
</script>
<!-- hero structure replica -->

    </g>
  </svg>
  <div class="hero-content"><h1 class="hero-title">Test</h1></div>
</section>
</body>
